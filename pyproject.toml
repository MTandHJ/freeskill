[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freeskill"
version = "0.1.0"
description = "Personal Agent Skills manager for installing skills into Claude Code and Codex."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
freeskill = "freeskill.cli:main"

[tool.setuptools]
packages = ["freeskill", "freeskill_skills"]

[tool.setuptools.package-dir]
freeskill = "src/freeskill"
freeskill_skills = "skills"

[tool.setuptools.package-data]
freeskill_skills = ["**/*"]

[tool.setuptools.exclude-package-data]
freeskill_skills = [
    ".DS_Store",
    "**/.DS_Store",
    "__pycache__/*",
    "**/__pycache__/*",
    "*.pyc",
    "**/*.pyc",
]
