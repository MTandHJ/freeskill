[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freeskill"
version = "0.1.0"
description = "Personal Agent Skills manager for installing skills into Claude Code and Codex."
readme = "README.md"
requires-python = ">=3.13"

[project.scripts]
freeskill = "freeskill.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
